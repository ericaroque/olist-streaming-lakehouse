resources:
  jobs:
    olist_pipeline:
      name: olist_job
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../scripts/02_bronze_ingestion.ipynb
            source: WORKSPACE

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../scripts/03_silver_transformation.ipynb
            source: WORKSPACE

        - task_key: gold_dimensions
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../scripts/05_gold_dimensions.ipynb
            source: WORKSPACE

        - task_key: gold_facts
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ../scripts/04_gold_facts.ipynb
            source: WORKSPACE

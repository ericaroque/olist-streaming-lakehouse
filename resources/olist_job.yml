resources:
  jobs:
    olist_pipeline:
      name: olist_job
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/olist_landing/batched_files/
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 60

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../scripts/02_bronze_ingestion.ipynb
            source: WORKSPACE

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../scripts/03_silver_transformation.ipynb
            source: WORKSPACE

        - task_key: simulate_order_deliveries
          depends_on:
            - task_key: silver
          run_if: ALL_SUCCESS  
          notebook_task:
            notebook_path: ../scripts/simulate_order_deliveries.ipynb
            source: WORKSPACE

        - task_key: generate_synthetic_reviews
          depends_on:
            - task_key: simulate_order_deliveries
          run_if: ALL_SUCCESS  
          notebook_task:
            notebook_path: ../scripts/generate_synthetic_reviews.ipynb
            source: WORKSPACE

        - task_key: gold_dimensions
          depends_on:
            - task_key: generate_synthetic_reviews
          notebook_task:
            notebook_path: ../scripts/05_gold_dimensions.ipynb
            source: WORKSPACE

        - task_key: gold_facts
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ../scripts/04_gold_facts.ipynb
            source: WORKSPACE

        - task_key: gold_fact_review
          depends_on:
            - task_key: gold_facts
          notebook_task:
            notebook_path: ../scripts/customer_reviews.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS